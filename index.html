<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>GF 地图集</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider { scrollbar-width: none; }
  .slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 0 0;
    touch-action: manipulation;
    cursor: zoom-in;
    will-change: transform;
  }
  .slide img.zoomed { cursor: grab; }
  .slide img.panning { cursor: grabbing; }
  .toolbar {
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 0 8px;
    z-index: 10;
  }
  .toolbar a {
    padding: 9px 20px;
    border-radius: 20px;
    background: linear-gradient(#2563eb, #1d4ed8);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    flex-shrink: 0;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .toolbar a.active {
    background: linear-gradient(#3b82f6, #1d4ed8);
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.7);
  }
  .toolbar a:active { background: linear-gradient(#1d4ed8, #1e3a8a); }
</style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slide" id="slide-map"><img src="numbered.jpg" alt="地图"></div>
    <div class="slide" id="slide-numbered"><img src="map.jpg" alt="编号区域"></div>
    <div class="slide" id="slide-zones"><img src="zones.jpg" alt="分区图"></div>
    <div class="slide" id="slide-traffic"><img src="traffic.jpg" alt="交通限行"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <a href="#slide-map" data-slide="slide-map">地图</a>
    <a href="#slide-numbered" data-slide="slide-numbered">编号区域</a>
    <a href="#slide-zones" data-slide="slide-zones">分区图</a>
    <a href="#slide-traffic" data-slide="slide-traffic">交通限行</a>
    <a href="Banche.html">班车乘车须知</a>
    <a href="Busleader.html">车长须知</a>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const links = document.querySelectorAll('.toolbar a');
    function setActive(id) {
      links.forEach(a => a.classList.toggle('active', a.dataset.slide === id));
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { root: slider, threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));
    setActive('slide-map');

    // ---- Desktop zoom & pan (mouse wheel, double-click, drag) ----
    // Mobile/touch pinch-zoom is handled natively by the browser (see viewport meta above).
    document.querySelectorAll('.slide').forEach(slide => {
      const img = slide.querySelector('img');
      const minScale = 1, maxScale = 4;
      let scale = 1, tx = 0, ty = 0;
      let panStart = null;

      function localPoint(clientX, clientY) {
        const rect = slide.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function clampTranslate() {
        const rect = slide.getBoundingClientRect();
        const minTx = Math.min(0, rect.width - rect.width * scale);
        const minTy = Math.min(0, rect.height - rect.height * scale);
        tx = Math.max(minTx, Math.min(0, tx));
        ty = Math.max(minTy, Math.min(0, ty));
      }

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        img.classList.toggle('zoomed', scale > 1.01);
      }

      function zoomAt(px, py, newScale) {
        newScale = Math.max(minScale, Math.min(maxScale, newScale));
        const ratio = newScale / scale;
        tx = px - (px - tx) * ratio;
        ty = py - (py - ty) * ratio;
        scale = newScale;
        if (scale <= 1.01) { scale = 1; tx = 0; ty = 0; }
        clampTranslate();
        apply();
      }

      slide.addEventListener('wheel', (e) => {
        e.preventDefault();
        const p = localPoint(e.clientX, e.clientY);
        const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
        zoomAt(p.x, p.y, scale * factor);
      }, { passive: false });

      img.addEventListener('dblclick', (e) => {
        const p = localPoint(e.clientX, e.clientY);
        zoomAt(p.x, p.y, scale > 1.01 ? 1 : 2.5);
      });

      img.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || scale <= 1.01) return;
        panStart = { x: e.clientX, y: e.clientY, tx, ty };
        img.classList.add('panning');
        try { img.setPointerCapture(e.pointerId); } catch (err) {}
      });

      img.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse' || !panStart) return;
        tx = panStart.tx + (e.clientX - panStart.x);
        ty = panStart.ty + (e.clientY - panStart.y);
        clampTranslate();
        apply();
      });

      ['pointerup', 'pointercancel'].forEach(evt => img.addEventListener(evt, (e) => {
        if (e.pointerType !== 'mouse') return;
        panStart = null;
        img.classList.remove('panning');
      }));
    });
  </script>
</body>
</html>
