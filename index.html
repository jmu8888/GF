<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GF 地图集</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider { scrollbar-width: none; }
  .slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 0 0;
    touch-action: pan-x;
    cursor: zoom-in;
    will-change: transform;
  }
  .slide img.zoomed { cursor: grab; }
  .slide img.panning { cursor: grabbing; }
  .toolbar {
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 0 8px;
    z-index: 10;
  }
  .toolbar a {
    padding: 9px 20px;
    border-radius: 20px;
    background: linear-gradient(#2563eb, #1d4ed8);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    flex-shrink: 0;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .toolbar a.active {
    background: linear-gradient(#3b82f6, #1d4ed8);
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.7);
  }
  .toolbar a:active { background: linear-gradient(#1d4ed8, #1e3a8a); }
</style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slide" id="slide-map"><img src="numbered.jpg" alt="地图"></div>
    <div class="slide" id="slide-numbered"><img src="map.jpg" alt="编号区域"></div>
    <div class="slide" id="slide-zones"><img src="zones.jpg" alt="分区图"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <a href="#slide-map" data-slide="slide-map">地图</a>
    <a href="#slide-numbered" data-slide="slide-numbered">编号区域</a>
    <a href="#slide-zones" data-slide="slide-zones">分区图</a>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const links = document.querySelectorAll('.toolbar a');
    function setActive(id) {
      links.forEach(a => a.classList.toggle('active', a.dataset.slide === id));
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { root: slider, threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));
    setActive('slide-map');

    // ---- Pinch / wheel / double-click / double-tap zoom & pan ----
    document.querySelectorAll('.slide').forEach(slide => {
      const img = slide.querySelector('img');
      const minScale = 1, maxScale = 4;
      let scale = 1, tx = 0, ty = 0;
      const pointers = new Map();
      let pinchStart = null;
      let panStart = null;
      let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

      function localPoint(clientX, clientY) {
        const rect = slide.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function clampTranslate() {
        const rect = slide.getBoundingClientRect();
        const minTx = Math.min(0, rect.width - rect.width * scale);
        const minTy = Math.min(0, rect.height - rect.height * scale);
        tx = Math.max(minTx, Math.min(0, tx));
        ty = Math.max(minTy, Math.min(0, ty));
      }

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        const zoomed = scale > 1.01;
        img.classList.toggle('zoomed', zoomed);
        img.style.touchAction = zoomed ? 'none' : 'pan-x';
        slider.style.overflowX = zoomed ? 'hidden' : 'auto';
      }

      function zoomAt(px, py, newScale) {
        newScale = Math.max(minScale, Math.min(maxScale, newScale));
        const ratio = newScale / scale;
        tx = px - (px - tx) * ratio;
        ty = py - (py - ty) * ratio;
        scale = newScale;
        if (scale <= 1.01) { scale = 1; tx = 0; ty = 0; }
        clampTranslate();
        apply();
      }

      slide.addEventListener('wheel', (e) => {
        e.preventDefault();
        const p = localPoint(e.clientX, e.clientY);
        const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
        zoomAt(p.x, p.y, scale * factor);
      }, { passive: false });

      img.addEventListener('dblclick', (e) => {
        const p = localPoint(e.clientX, e.clientY);
        zoomAt(p.x, p.y, scale > 1.01 ? 1 : 2.5);
      });

      img.addEventListener('pointerdown', (e) => {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { img.setPointerCapture(e.pointerId); } catch (err) {}

        if (pointers.size === 1) {
          if (e.pointerType === 'touch') {
            const now = Date.now();
            const dx = Math.abs(e.clientX - lastTapX);
            const dy = Math.abs(e.clientY - lastTapY);
            if (now - lastTapTime < 300 && dx < 30 && dy < 30) {
              const p = localPoint(e.clientX, e.clientY);
              zoomAt(p.x, p.y, scale > 1.01 ? 1 : 2.5);
              lastTapTime = 0;
              panStart = null;
              return;
            }
            lastTapTime = now;
            lastTapX = e.clientX;
            lastTapY = e.clientY;
          }
          if (scale > 1.01) {
            panStart = { x: e.clientX, y: e.clientY, tx, ty };
            img.classList.add('panning');
          }
        } else if (pointers.size === 2) {
          panStart = null;
          img.classList.remove('panning');
          const pts = Array.from(pointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const mid = localPoint((pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
          pinchStart = { dist, midX: mid.x, midY: mid.y, scale, tx, ty };
        }
      });

      img.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2 && pinchStart) {
          const pts = Array.from(pointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const ratio = dist / pinchStart.dist;
          const newScale = Math.max(minScale, Math.min(maxScale, pinchStart.scale * ratio));
          const zratio = newScale / pinchStart.scale;
          tx = pinchStart.midX - (pinchStart.midX - pinchStart.tx) * zratio;
          ty = pinchStart.midY - (pinchStart.midY - pinchStart.ty) * zratio;
          scale = newScale <= 1.01 ? 1 : newScale;
          if (scale === 1) { tx = 0; ty = 0; }
          clampTranslate();
          apply();
        } else if (pointers.size === 1 && panStart && scale > 1.01) {
          tx = panStart.tx + (e.clientX - panStart.x);
          ty = panStart.ty + (e.clientY - panStart.y);
          clampTranslate();
          apply();
        }
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);
        try { img.releasePointerCapture(e.pointerId); } catch (err) {}
        img.classList.remove('panning');
        if (pointers.size < 2) pinchStart = null;
        if (pointers.size === 0) {
          panStart = null;
        } else if (pointers.size === 1 && scale > 1.01) {
          const [remaining] = pointers.values();
          panStart = { x: remaining.x, y: remaining.y, tx, ty };
        }
      }
      img.addEventListener('pointerup', endPointer);
      img.addEventListener('pointercancel', endPointer);

      apply();
    });
  </script>
</body>
</html>
