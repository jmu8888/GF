<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GF 地图集</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider { scrollbar-width: none; }
  .slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .toolbar {
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 0 8px;
    z-index: 10;
  }
  .toolbar a {
    padding: 9px 20px;
    border-radius: 20px;
    background: linear-gradient(#2563eb, #1d4ed8);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    flex-shrink: 0;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .toolbar a.active {
    background: linear-gradient(#3b82f6, #1d4ed8);
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.7);
  }
  .toolbar a:active { background: linear-gradient(#1d4ed8, #1e3a8a); }
</style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slide" id="slide-map"><img src="numbered.jpg" alt="地图"></div>
    <div class="slide" id="slide-numbered"><img src="map.jpg" alt="编号区域"></div>
    <div class="slide" id="slide-zones"><img src="zones.jpg" alt="分区图"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <a href="#slide-map" data-slide="slide-map">地图</a>
    <a href="#slide-numbered" data-slide="slide-numbered">编号区域</a>
    <a href="#slide-zones" data-slide="slide-zones">分区图</a>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const links = document.querySelectorAll('.toolbar a');
    function setActive(id) {
      links.forEach(a => a.classList.toggle('active', a.dataset.slide === id));
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { root: slider, threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));
    setActive('slide-map');
  </script>
</body>
</html>
